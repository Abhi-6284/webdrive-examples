<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla JS WebDrive Example</title>
  <link rel="stylesheet" href="https://unpkg.com/webdrive@latest/dist/webdrive.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 16px 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .card {
      background: var(--card);
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h2>Vanilla JS SaaS App</h2>
    <button id="vanilla-tour-btn">Start Tour</button>
  </header>

  <div class="grid">
    <div id="card-users" class="card">
      <h3>Active Users</h3>
      <p style="font-size: 1.5rem; font-weight: bold;">12,450</p>
    </div>
    <div id="card-revenue" class="card">
      <h3>Revenue</h3>
      <p style="font-size: 1.5rem; font-weight: bold;">$94,200</p>
    </div>
    <div id="card-retention" class="card">
      <h3>Retention</h3>
      <p style="font-size: 1.5rem; font-weight: bold;">89.4%</p>
    </div>
  </div>

  <script type="module">
    import { WebDrive } from "https://unpkg.com/webdrive@latest/dist/index.js";

    const tour = new WebDrive({
      steps: [
        { element: "#vanilla-tour-btn", title: "Tour Trigger", description: "Click to begin or restart the tour." },
        { element: "#card-users", title: "User Base", description: "Real-time active customer count.", position: "bottom" },
        { element: "#card-revenue", title: "Revenue", description: "Monthly recurring subscription volume.", position: "bottom" },
        { element: "#card-retention", title: "Retention", description: "Cohort stability over 90 days.", position: "bottom" }
      ],
      showProgress: true,
      animate: true
    });

    document.getElementById("vanilla-tour-btn").addEventListener("click", () => {
      tour.start();
    });
  </script>
</body>
</html>
